<style>
/* ═══════════════════════════════════════════════════════════════════ */
/* [1] Design Tokens                                                  */
/* ═══════════════════════════════════════════════════════════════════ */
:root {
  --bg-base: #06070A;
  --bg-panel: #0E1117;
  --bg-elevated: #141821;
  --bg-soft: #1A1F2B;
  --bg-overlay: rgba(4, 5, 8, 0.88);

  --border-subtle: rgba(255, 255, 255, 0.06);
  --border-default: rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.15);
  --border-accent: rgba(212, 160, 64, 0.28);

  --text-primary: #F5F7FA;
  --text-secondary: #A0A7B5;
  --text-tertiary: #6B7280;
  --text-muted: #4A5060;

  --gold: #D4A040;
  --gold-light: #F0D77B;
  --gold-bright: #FFD966;
  --gold-glow: rgba(212, 160, 64, 0.5);

  --danger: #EF4444;
  --danger-glow: rgba(239, 68, 68, 0.35);
  --warning: #F59E0B;
  --success: #10B981;
  --info: #3B82F6;

  --r-xs: 6px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-2xl: 32px;
  --r-full: 9999px;

  --shadow-sm: 0 4px 12px -2px rgba(0, 0, 0, 0.5);
  --shadow-md: 0 12px 32px -8px rgba(0, 0, 0, 0.6);
  --shadow-lg: 0 24px 64px -16px rgba(0, 0, 0, 0.75);
  --shadow-xl: 0 32px 96px -24px rgba(0, 0, 0, 0.85);
  --shadow-gold: 0 12px 40px -10px var(--gold-glow);
  --shadow-gold-lg: 0 24px 72px -16px var(--gold-glow);

  --font-arabic: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --font-kufi: 'Noto Kufi Arabic', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Menlo', monospace;

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }

body {
  font-family: var(--font-arabic);
  background: var(--bg-base);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  position: relative;
}

.bg-art {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.bg-art::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(212, 160, 64, 0.10), transparent 50%),
    radial-gradient(circle at 80% 30%, rgba(59, 130, 246, 0.06), transparent 45%),
    radial-gradient(circle at 50% 90%, rgba(16, 185, 129, 0.07), transparent 45%);
  animation: bgDrift 20s ease-in-out infinite alternate;
}

@keyframes bgDrift {
  0% { transform: scale(1) translate(0, 0); }
  100% { transform: scale(1.08) translate(-2%, -2%); }
}

.bg-art::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
  background-size: 24px 24px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}

/* ═══════════════════════════════════════════════════════════════════ */
/* [2] Main Layout                                                   */
/* ═══════════════════════════════════════════════════════════════════ */
.page-wrap {
  position: relative;
  z-index: 1;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
}

/* ═══════════════════════════════════════════════════════════════════ */
/* [3] Hero                                                          */
/* ═══════════════════════════════════════════════════════════════════ */
.hero {
  text-align: center;
  margin-bottom: 48px;
  animation: heroEnter 1s var(--ease-out);
  max-width: 760px;
}

@keyframes heroEnter {
  from { opacity: 0; transform: translateY(30px); filter: blur(8px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}

.hero-logo-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 36px;
  min-height: 130px;
  padding: 0 40px;
  perspective: 1000px;
}

.logo-morph-box {
  position: relative;
  width: 108px;
  height: 108px;
  border-radius: 26px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 45%, var(--gold-light) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #1A1508;
  font-family: var(--font-kufi);
  font-weight: 900;
  box-shadow:
    var(--shadow-gold-lg),
    inset 0 1px 0 rgba(255, 255, 255, 0.4),
    inset 0 -2px 4px rgba(0, 0, 0, 0.15);
  overflow: hidden;
  animation: morphExpand 8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  transform-origin: center;
  will-change: width, height, border-radius;
}

.logo-morph-box::before {
  content: '';
  position: absolute;
  top: 0;
  left: -150%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
  transform: skewX(-25deg);
  animation: morphShine 8s ease-in-out infinite;
  pointer-events: none;
}

.logo-morph-letter {
  position: absolute;
  font-size: 3.2rem;
  line-height: 1;
  letter-spacing: -2px;
  will-change: opacity, transform;
  animation: morphLetterOut 8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
}

.logo-morph-text {
  position: absolute;
  font-size: 3.1rem;
  line-height: 1;
  letter-spacing: -2px;
  white-space: nowrap;
  opacity: 0;
  will-change: opacity, transform, filter;
  animation: morphTextIn 8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
}

@keyframes morphExpand {
  0%, 12% { width: 108px; height: 108px; border-radius: 26px; }
  22%, 30% { width: 420px; height: 108px; border-radius: 54px; }
  40%, 68% { width: 420px; height: 108px; border-radius: 54px; }
  78%, 86% { width: 108px; height: 108px; border-radius: 26px; }
  92%, 100% { width: 108px; height: 108px; border-radius: 26px; }
}

@keyframes morphLetterOut {
  0%, 15% { opacity: 1; transform: scale(1) rotate(0); }
  22%, 68% { opacity: 0; transform: scale(0.4) rotate(-90deg); }
  78%, 100% { opacity: 1; transform: scale(1) rotate(0); }
}

@keyframes morphTextIn {
  0%, 20% { opacity: 0; transform: scale(0.5); filter: blur(12px); }
  32%, 66% { opacity: 1; transform: scale(1); filter: blur(0); }
  78%, 100% { opacity: 0; transform: scale(0.5); filter: blur(12px); }
}

@keyframes morphShine {
  0%, 15% { left: -150%; }
  35% { left: 150%; }
  65% { left: 150%; }
  85%, 100% { left: -150%; }
}

.hero-subtitle {
  font-size: 1.05rem;
  color: var(--text-secondary);
  max-width: 620px;
  margin: 0 auto;
  line-height: 1.8;
  font-weight: 400;
  opacity: 0;
  animation: fadeUp 0.8s var(--ease-out) 1s forwards;
}

.hero-subtitle strong {
  color: var(--gold-light);
  font-weight: 700;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ═══════════════════════════════════════════════════════════════════ */
/* [4] CTA Cards                                                     */
/* ═══════════════════════════════════════════════════════════════════ */
.cta-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  width: 100%;
  max-width: 720px;
  opacity: 0;
  animation: fadeUp 0.8s var(--ease-out) 1.4s forwards;
}

.main-cta {
  position: relative;
  background: linear-gradient(155deg, var(--bg-elevated) 0%, var(--bg-panel) 55%, var(--bg-base) 100%);
  border: 1px solid var(--border-default);
  border-radius: var(--r-2xl);
  padding: 36px 32px;
  cursor: pointer;
  overflow: hidden;
  text-align: right;
  font-family: inherit;
  color: inherit;
  transition: all 0.5s var(--ease-out);
  isolation: isolate;
  box-shadow:
    var(--shadow-xl),
    inset 0 1px 0 rgba(255, 255, 255, 0.05),
    inset 0 0 0 1px rgba(212, 160, 64, 0.05);
}

.main-cta::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), var(--gold-bright), var(--gold), transparent);
  opacity: 0.9;
}

.main-cta::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(212, 160, 64, 0.15), transparent 60%);
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
}

.main-cta:hover {
  transform: translateY(-6px);
  border-color: var(--border-accent);
  box-shadow:
    0 40px 100px -20px rgba(212, 160, 64, 0.35),
    0 24px 64px -16px rgba(0, 0, 0, 0.8);
}

.main-cta:hover::after { opacity: 1; }
.main-cta:active { transform: translateY(-3px) scale(0.995); }

.main-cta-content {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 24px;
}

.main-cta-icon {
  width: 72px;
  height: 72px;
  border-radius: var(--r-lg);
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 50%, var(--gold-light) 100%);
  display: grid;
  place-items: center;
  font-size: 32px;
  color: #1A1508;
  flex-shrink: 0;
  box-shadow: 0 12px 32px -8px var(--gold-glow), inset 0 1px 0 rgba(255, 255, 255, 0.4);
  transition: transform 0.5s var(--ease-spring);
  position: relative;
  overflow: hidden;
}

.main-cta-icon::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.5), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s ease;
}

.main-cta:hover .main-cta-icon { transform: scale(1.08) rotate(-8deg); }
.main-cta:hover .main-cta-icon::before { transform: translateX(100%); }

.main-cta-text { flex: 1; min-width: 0; }

.main-cta-title {
  font-family: var(--font-kufi);
  font-size: 1.35rem;
  font-weight: 900;
  color: var(--text-primary);
  margin-bottom: 6px;
  letter-spacing: -0.3px;
  line-height: 1.3;
}

.main-cta-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
  font-weight: 500;
}

.main-cta-arrow {
  width: 48px;
  height: 48px;
  border-radius: var(--r-md);
  background: rgba(212, 160, 64, 0.08);
  border: 1px solid var(--border-accent);
  display: grid;
  place-items: center;
  color: var(--gold-light);
  font-size: 16px;
  flex-shrink: 0;
  transition: all 0.35s var(--ease-out);
}

.main-cta:hover .main-cta-arrow {
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: #1A1508;
  border-color: transparent;
  transform: translateX(-4px);
  box-shadow: 0 8px 24px -6px var(--gold-glow);
}

.quick-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.quick-tab {
  position: relative;
  background: linear-gradient(155deg, var(--bg-elevated) 0%, var(--bg-panel) 100%);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-xl);
  padding: 24px 22px;
  cursor: pointer;
  overflow: hidden;
  text-align: right;
  font-family: inherit;
  color: inherit;
  transition: all 0.4s var(--ease-out);
  isolation: isolate;
  display: flex;
  align-items: flex-start;
  gap: 16px;
  box-shadow: var(--shadow-md);
}

.quick-tab::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 3px; height: 100%;
  background: var(--tab-color, var(--gold));
  transform: scaleY(0);
  transform-origin: top;
  transition: transform 0.4s var(--ease-out);
}

.quick-tab::after {
  content: '';
  position: absolute;
  top: -50%; right: -50%;
  width: 200px; height: 200px;
  background: radial-gradient(circle, var(--tab-glow, var(--gold-glow)), transparent 70%);
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
  z-index: 0;
}

.quick-tab:hover {
  transform: translateY(-4px);
  border-color: var(--border-default);
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(212, 160, 64, 0.15);
}

.quick-tab:hover::before { transform: scaleY(1); }
.quick-tab:hover::after { opacity: 0.6; }
.quick-tab:active { transform: translateY(-2px) scale(0.99); }

.quick-tab[data-tab-color="gold"] { --tab-color: var(--gold); --tab-glow: var(--gold-glow); }
.quick-tab[data-tab-color="blue"] { --tab-color: #3B82F6; --tab-glow: rgba(59, 130, 246, 0.4); }

.quick-tab-icon {
  width: 44px;
  height: 44px;
  border-radius: var(--r-md);
  display: grid;
  place-items: center;
  font-size: 18px;
  flex-shrink: 0;
  color: var(--tab-color, var(--gold));
  background: linear-gradient(135deg, var(--tab-glow, var(--gold-glow)), transparent);
  border: 1px solid var(--tab-color, var(--gold));
  opacity: 0.85;
  transition: all 0.35s var(--ease-spring);
  position: relative;
  z-index: 2;
}

.quick-tab:hover .quick-tab-icon {
  transform: scale(1.1) rotate(-6deg);
  background: var(--tab-color, var(--gold));
  color: #1A1508;
  opacity: 1;
}

.quick-tab-info { flex: 1; min-width: 0; position: relative; z-index: 2; }

.quick-tab-title {
  font-family: var(--font-kufi);
  font-size: 1rem;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 4px;
  letter-spacing: -0.2px;
}

.quick-tab-desc {
  font-size: 12px;
  color: var(--text-tertiary);
  line-height: 1.5;
  font-weight: 500;
}

.quick-tab-count {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: var(--r-full);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  margin-top: 10px;
  direction: ltr;
}

.quick-tab-count i { font-size: 8px; color: var(--tab-color, var(--gold)); }

/* ═══════════════════════════════════════════════════════════════════ */
/* [5] Footer                                                        */
/* ═══════════════════════════════════════════════════════════════════ */
.page-footer {
  margin-top: 56px;
  text-align: center;
  opacity: 0;
  animation: fadeUp 0.8s var(--ease-out) 1.8s forwards;
  max-width: 720px;
}

.page-footer-divider {
  width: 60px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 0 auto 24px;
  border-radius: var(--r-full);
  opacity: 0.5;
}

.page-footer p {
  font-size: 13px;
  color: var(--text-tertiary);
  line-height: 1.9;
  font-weight: 500;
}

/* ═══════════════════════════════════════════════════════════════════ */
/* [6] Help Center Overlay                                           */
/* ═══════════════════════════════════════════════════════════════════ */
.help-overlay {
  position: fixed;
  inset: 0;
  z-index: 100001;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: var(--bg-overlay);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.35s ease, visibility 0.35s;
  padding-top: max(20px, env(safe-area-inset-top));
  padding-bottom: max(20px, env(safe-area-inset-bottom));
}

.help-overlay.active { opacity: 1; visibility: visible; }

.help-panel-wrapper {
  position: relative;
  width: 100%;
  max-width: 720px;
  max-height: calc(100dvh - 40px);
  background: linear-gradient(160deg, var(--bg-panel) 0%, var(--bg-base) 100%);
  border: 1px solid var(--border-default);
  border-radius: var(--r-xl);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(212, 160, 64, 0.08);
  transform: scale(0.94) translateY(16px);
  opacity: 0;
  transition: transform 0.45s var(--ease-out), opacity 0.35s ease;
}

.help-panel-wrapper::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), var(--gold-bright), var(--gold), transparent);
  z-index: 3;
}

.help-overlay.active .help-panel-wrapper { transform: scale(1) translateY(0); opacity: 1; }

.help-handle {
  display: none;
  position: absolute;
  top: 10px; left: 50%;
  transform: translateX(-50%);
  width: 44px; height: 5px;
  border-radius: var(--r-full);
  background: rgba(255, 255, 255, 0.18);
  z-index: 5;
}

.help-header {
  position: relative;
  padding: 26px 24px 0;
  background: linear-gradient(160deg, var(--bg-elevated) 0%, var(--bg-panel) 100%);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
  overflow: hidden;
}

.help-header::after {
  content: '';
  position: absolute;
  top: -80px; right: -80px;
  width: 240px; height: 240px;
  background: radial-gradient(circle, var(--gold-glow), transparent 70%);
  opacity: 0.3;
  pointer-events: none;
}

.help-header-top {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
  position: relative;
  z-index: 2;
}

.help-header-icon {
  width: 48px; height: 48px;
  border-radius: var(--r-md);
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 100%);
  display: grid;
  place-items: center;
  font-size: 20px;
  color: #1A1508;
  box-shadow: 0 8px 20px -6px var(--gold-glow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  flex-shrink: 0;
}

.help-header-text { flex: 1; min-width: 0; }

.help-header h2 {
  font-family: var(--font-kufi);
  font-size: 20px;
  font-weight: 900;
  color: var(--text-primary);
  margin: 0 0 4px;
  letter-spacing: -0.3px;
  line-height: 1.2;
}

.help-subtitle {
  font-size: 12.5px;
  color: var(--text-tertiary);
  margin: 0;
  line-height: 1.5;
  font-weight: 500;
}

.help-close {
  width: 38px; height: 38px;
  border-radius: var(--r-md);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 13px;
  transition: all 0.25s var(--ease-out);
  flex-shrink: 0;
}

.help-close:hover {
  background: var(--danger);
  border-color: var(--danger);
  color: #fff;
  transform: rotate(90deg);
}

.help-tabs {
  display: flex;
  gap: 6px;
  padding: 0 4px;
  position: relative;
  z-index: 2;
  border-bottom: 1px solid var(--border-subtle);
}

.help-tab {

.ts-card {

.ts-card-text { flex: 1; line-height: 1.35; display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.help-empty {

}

.help-empty .empty-icon {

.help-footer {

/* [7] Nested Modal                                                  */
/* ═══════════════════════════════════════════════════════════════════ */
.ts-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.82);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  z-index: 100050;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.35s ease, visibility 0.35s;
}

.ts-overlay.active { opacity: 1; visibility: visible; }

.ts-panel-wrapper {
  position: relative;
  width: 100%;
  max-width: 560px;
  max-height: calc(100dvh - 40px);
  background: linear-gradient(160deg, var(--bg-panel) 0%, var(--bg-base) 100%);
  border: 1px solid var(--border-default);
  border-radius: var(--r-xl);
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 26px 24px 22px;
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(212, 160, 64, 0.08);
  transform: scale(0.94) translateY(16px);
  opacity: 0;
  transition: transform 0.45s var(--ease-out), opacity 0.35s ease;
  scrollbar-width: thin;
  scrollbar-color: rgba(212, 160, 64, 0.4) transparent;
}

.ts-panel-wrapper::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), var(--gold-bright), var(--gold), transparent);
  z-index: 3;
  border-radius: var(--r-xl) var(--r-xl) 0 0;
}

.ts-overlay.active .ts-panel-wrapper { transform: scale(1) translateY(0); opacity: 1; }

.ts-panel-wrapper::-webkit-scrollbar { width: 5px; }
.ts-panel-wrapper::-webkit-scrollbar-thumb { background: rgba(212, 160, 64, 0.4); border-radius: var(--r-full); }

.ts-handle {
  display: none;
  position: absolute;
  top: 10px; left: 50%;
  transform: translateX(-50%);
  width: 44px; height: 5px;
  border-radius: var(--r-full);
  background: rgba(255, 255, 255, 0.18);
  z-index: 5;
}

.ts-close {
  position: absolute;
  top: 16px; left: 16px;
  width: 38px; height: 38px;
  border-radius: var(--r-md);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.25s var(--ease-out);
  font-size: 13px;
  z-index: 10;
}

.ts-close:hover { background: var(--danger); border-color: var(--danger); color: #fff; transform: rotate(90deg); }

.ts-panel-header {
  text-align: center;
  margin-bottom: 20px;
  padding: 0 44px;
}

.ts-panel-header h3 {
  font-family: var(--font-kufi);
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-secondary);
}

.ts-panel { direction: rtl; text-align: right; }

.ts-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  margin-bottom: 24px;
  text-align: center;
}

.ts-icon-wrap { position: relative; width: 72px; height: 72px; display: grid; place-items: center; }

.ts-icon-bg {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  opacity: 0.12;
  animation: tsPulse 3.5s ease-in-out infinite;
  filter: blur(8px);
}

.ts-icon-ring {

  border: 1.5px solid currentColor;

}

@keyframes tsPulse {
  0%, 100% { transform: scale(1); opacity: 0.12; }
  50% { transform: scale(1.08); opacity: 0.18; }
}

@keyframes tsRing {
  0% { transform: scale(0.92); opacity: 0.35; }

.ts-icon-main {

  width: 58px; height: 58px;

.ts-title {

.ts-section {

  flex-direction: column;

}

.ts-list-item {

  function updateCounts() {
    var tsCount = 0;
    TS_GROUPS.forEach(function (g) { tsCount += g.items.length; });
    var faqCount = 0;
    FAQ_DATA.forEach(function (s) { faqCount += s.faqs.length; });

    ['countTs', 'tabCountTs'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.textContent = tsCount;
    });
    ['countFaq', 'tabCountFaq'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.textContent = faqCount;
    });
  }

  function openHelpCenter(tab) {
    var overlay = document.getElementById('helpCenterOverlay');
    if (!overlay) return;

    if (!previousTitle) previousTitle = document.title;
    document.title = 'مركز المساعدة وحل المشكلات | LomedX';
    injectFaqSchema();

    renderTroubleshootPanel();
    renderFaqPanel();
    updateCounts();
    switchHelpTab(tab || CONFIG.currentTab);

    overlay.classList.add('active');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeHelpCenter() {
    var overlay = document.getElementById('helpCenterOverlay');
    if (!overlay) return;
    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    closeTroubleshootModal();
    if (previousTitle) { document.title = previousTitle; previousTitle = null; }
    var schema = document.getElementById('helpCenterFaqSchema');
    if (schema) schema.remove();
  }

  function switchHelpTab(tabName) {
    CONFIG.currentTab = tabName;
    document.querySelectorAll('.help-tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.tab === tabName);
    });
    document.querySelectorAll('.help-panel').forEach(function (p) { p.classList.remove('active'); });
    var panel = document.getElementById('panel' + tabName.charAt(0).toUpperCase() + tabName.slice(1));
    if (panel) panel.classList.add('active');
    var topics = document.getElementById('helpTopicsContainer');
    if (topics) topics.scrollTop = 0;
  }

  function renderTroubleshootPanel(filter) {
    var container = document.getElementById('panelTroubleshoot');
    if (!container) return;

    var q = (filter || '').trim().toLowerCase();
    var groupsToRender = TS_GROUPS;

    if (q.length >= 2) {
      groupsToRender = TS_GROUPS.map(function (g) {
        var matching = g.items.filter(function (item) {
          return item.label.toLowerCase().indexOf(q) !== -1 ||
                 item.desc.toLowerCase().indexOf(q) !== -1 ||
                 item.tool.toLowerCase().indexOf(q) !== -1;
        });
        if (matching.length === 0) return null;
        return { title: g.title, icon: g.icon, items: matching };
      }).filter(Boolean);
    }

    if (groupsToRender.length === 0) {
      container.innerHTML = emptyState();
      return;
    }

    var html = '<div class="ts-groups">';
    groupsToRender.forEach(function (group) {
      html += '<div class="ts-group">';
      html += '<div class="ts-group-title"><i class="fas ' + group.icon + '"></i><span>' + escapeHtml(group.title) + '</span></div>';
      html += '<div class="ts-grid">';
      group.items.forEach(function (item) {
        var detailsAttr = item.details
          ? ' data-details=\'' + JSON.stringify(item.details).replace(/'/g, '&#39;') + '\''
          : '';
        html += '<button type="button" class="ts-card" data-ts-action="trigger-issue"'
              + ' data-tool="' + escapeHtml(item.tool) + '"'
              + ' data-type="' + escapeHtml(item.type) + '"'
              + detailsAttr + '>';
        html += '<div class="ts-card-icon"><i class="fas ' + item.icon + '"></i></div>';
        html += '<div class="ts-card-text">';
        html += '<strong>' + escapeHtml(item.label) + '</strong>';
        html += '<small>' + escapeHtml(item.desc) + '</small>';
        html += '</div></button>';
      });
      html += '</div></div>';
    });
    html += '</div>';
    container.innerHTML = html;
  }

  function renderFaqPanel(filter) {
    var container = document.getElementById('panelFaq');
    if (!container) return;

    var q = (filter || '').trim().toLowerCase();
    var sectionsToRender = FAQ_DATA;

    if (q.length >= 2) {
      sectionsToRender = FAQ_DATA.map(function (section) {
        var titleMatch = section.title.toLowerCase().indexOf(q) !== -1 ||
                         section.desc.toLowerCase().indexOf(q) !== -1;
        var matchingFaqs = section.faqs.filter(function (faq) {
          return faq.q.toLowerCase().indexOf(q) !== -1 ||
                 faq.a.toLowerCase().indexOf(q) !== -1;
        });
        if (titleMatch) return section;
        if (matchingFaqs.length > 0) {
          var copy = {};
          for (var k in section) copy[k] = section[k];
          copy.faqs = matchingFaqs;
          return copy;
        }
        return null;
      }).filter(Boolean);
    }

    if (sectionsToRender.length === 0) {
      container.innerHTML = emptyState();
      return;
    }

    var html = '<div class="ts-groups">';
    html += '<div class="ts-group">';
    html += '<div class="ts-group-title"><i class="fas fa-book-open"></i><span>أقسام الدليل الشامل</span></div>';
    html += '<div class="ts-grid ts-grid--faq">';

    sectionsToRender.forEach(function (section) {
      var faqCount = section.faqs.length;
      html += '<button type="button" class="ts-card ts-card--faq" data-ts-action="open-faq" data-faq-id="' + escapeHtml(section.id) + '">';
      html += '<div class="ts-card-icon" style="background:linear-gradient(135deg,' + section.color + '25,' + section.color + '08);color:' + section.color + ';box-shadow:0 4px 12px -4px ' + section.color + '40;">';
      html += '<i class="fas ' + escapeHtml(section.icon) + '"></i>';
      html += '</div>';
      html += '<div class="ts-card-text">';
      html += '<strong>' + escapeHtml(section.title) + '</strong>';
      html += '<small>' + faqCount + ' سؤال</small>';
      html += '</div>';
      html += '<span class="ts-card-count">' + faqCount + '</span>';
      html += '</button>';
    });

    html += '</div></div></div>';
    container.innerHTML = html;
  }

  function emptyState() {
    return '<div class="help-empty">' +
      '<div class="empty-icon"><i class="fas fa-magnifying-glass"></i></div>' +

  function filterHelpCenter(query) {
    var q = (query || '').trim().toLowerCase();
    if (q.length < 2) { renderTroubleshootPanel(); renderFaqPanel(); return; }
    renderTroubleshootPanel(q);
    renderFaqPanel(q);
    var tsHas = document.querySelectorAll('#panelTroubleshoot .ts-card').length > 0;
    var faqHas = document.querySelectorAll('#panelFaq .ts-card--faq').length > 0;
    if (tsHas && !faqHas) switchHelpTab('troubleshoot');
    else if (faqHas && !tsHas) switchHelpTab('faq');
  }

    setTimeout(function () {
      var w = overlay.querySelector('.ts-panel-wrapper');
      if (w) w.scrollTop = 0;
    }, 50);
  }

  function buildFaqSectionHTML(section) {
    var headerHTML =
      '<div class="ts-header">' +
      '<div class="ts-icon-wrap" style="color:' + section.color + '">' +
      '<div class="ts-icon-bg" style="background:' + section.color + '"></div>' +
      '<div class="ts-icon-ring"></div>' +
      '<div class="ts-icon-main" style="background:linear-gradient(135deg,' + section.color + ' 0%,' + section.color + 'cc 100%)">' +
      '<i class="fas ' + escapeHtml(section.icon) + '"></i>' +
      '</div></div>' +
      '<h3 class="ts-title">' + escapeHtml(section.title) + '</h3>' +
      '<div class="ts-badges">' +
      '<span class="ts-badge ts-badge--tool"><i class="fas fa-list-check"></i> ' + section.faqs.length + ' سؤال</span>' +
      '</div></div>';

    var faqListHTML = section.faqs.map(function (faq, i) {
      return '<div class="faq-item" data-faq-index="' + i + '">' +
        '<button type="button" class="faq-item-header" data-ts-action="toggle-faq">' +
        '<span class="faq-item-num">' + (i + 1) + '</span>' +
        '<span class="faq-item-q">' + escapeHtml(faq.q) + '</span>' +
        '<i class="fas fa-chevron-down faq-item-chevron"></i>' +
        '</button>' +
        '<div class="faq-item-body">' +
        '<div class="faq-item-answer">' + faq.a + '</div>' +
        (faq.tip ? '<div class="help-tip"><i class="fas fa-lightbulb"></i><span>' + escapeHtml(faq.tip) + '</span></div>' : '') +
        '</div></div>';
    }).join('');

    var faqSectionHTML = '<div class="faq-section-intro"><p>' + escapeHtml(section.desc) + '</p></div>' +
      '<div class="faq-section-list">' + faqListHTML + '</div>';

    var actionsHTML =
      '<div class="ts-actions">' +
      '<button type="button" class="ts-btn ts-btn--primary" data-ts-action="support">' +
      '<i class="fas fa-headset"></i> <span>تواصل مع الدعم</span>' +
      '</button>' +
      '<button type="button" class="ts-btn ts-btn--secondary" data-ts-action="close-modal">' +
      '<i class="fas fa-arrow-rotate-left"></i> <span>العودة</span>' +
      '</button></div>';

    return '<div class="ts-panel">' + headerHTML + faqSectionHTML + actionsHTML + '</div>';
  }

  function toggleFaqItem(headerEl) {
    var item = headerEl.closest ? headerEl.closest('.faq-item') : headerEl.parentElement;
    if (!item) return;
    var isOpen = item.classList.contains('open');
    var parent = item.parentElement;
    if (parent) parent.querySelectorAll('.faq-item.open').forEach(function (i) { i.classList.remove('open'); });
    if (!isOpen) item.classList.add('open');
  }

  function openTroubleshootModal(toolName, issueType, details) {
    toolName = toolName || 'غير محددة';
    issueType = issueType || 'unknown';
    details = details || {};

    if (!ISSUES[issueType]) issueType = 'unknown';
    var issue = ISSUES[issueType];
    var errorId = generateErrorId();
    currentTsErrorId = errorId;

    var overlay = document.getElementById('tsModalOverlay');
    if (!overlay) return;

    overlay.querySelector('.ts-panel-body').innerHTML =
      buildTroubleshootHTML(toolName, issueType, issue, errorId, details);

    overlay.classList.add('active');
    overlay.setAttribute('aria-hidden', 'false');

    setTimeout(function () {
      var w = overlay.querySelector('.ts-panel-wrapper');
      if (w) w.scrollTop = 0;
    }, 50);

    if (issueType === 'rate_limit' && details.retryAfter) startCountdown(details.retryAfter);
  }

  function closeTroubleshootModal() {
    var overlay = document.getElementById('tsModalOverlay');
    if (!overlay) return;
    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden', 'true');
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
    currentTsErrorId = null;
  }

  function buildTroubleshootHTML(toolName, issueType, issue, errorId, details) {
    var safeToolName = escapeHtml(toolName);
    var isOnline = navigator.onLine;
    var localTime = new Date().toLocaleString('ar-SY', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });

    var headerHTML =
      '<div class="ts-header">' +
      '<div class="ts-icon-wrap" style="color:' + issue.color + '">' +
      '<div class="ts-icon-bg" style="background:' + issue.color + '"></div>' +
      '<div class="ts-icon-ring"></div>' +
      '<div class="ts-icon-main" style="background:linear-gradient(135deg,' + issue.color + ' 0%,' + issue.color + 'cc 100%)">' +
      '<i class="fas ' + issue.icon + '"></i>' +
      '</div></div>' +
      '<h3 class="ts-title">' + escapeHtml(issue.title) + '</h3>' +
      '<div class="ts-badges">' +
      '<span class="ts-badge ts-badge--tool"><i class="fas fa-toolbox"></i> ' + safeToolName + '</span>' +
      '<button type="button" class="ts-badge ts-badge--id" data-ts-action="copy-id" data-error-id="' + errorId + '">' +
      '<i class="fas fa-fingerprint"></i> ' + errorId +
      '</button></div></div>';

    var countdownHTML = '';
    if (issueType === 'rate_limit' && details.retryAfter) {
      countdownHTML = '<div class="ts-countdown">' +
        '<div class="ts-countdown-label"><i class="fas fa-hourglass-half"></i> يمكنك المحاولة بعد</div>' +
        '<div class="ts-countdown-value" data-countdown="' + details.retryAfter + '">' + formatTime(details.retryAfter) + '</div>' +
        '</div>';
    }

    var failedFieldsHTML = '';
    if (issueType === 'validation' && Array.isArray(details.fields) && details.fields.length) {
      var fieldsHtml = details.fields.map(function (f) {
        return '<li class="ts-list-item"><i class="fas fa-circle-xmark"></i>' +
          '<span><strong>' + escapeHtml(f.name) + ':</strong> ' + escapeHtml(f.error) + '</span></li>';
      }).join('');
      failedFieldsHTML = '<div class="ts-section ts-section--validation">' +
        '<div class="ts-section-title"><i class="fas fa-list-check"></i><span>حقول تحتاج مراجعة (' + details.fields.length + ')</span></div>' +
        '<ul class="ts-list">' + fieldsHtml + '</ul></div>';
    }

    var reasonHTML = '<div class="ts-section ts-section--reason">' +
      '<div class="ts-section-title"><i class="fas fa-bug"></i> <span>السبب المحتمل</span></div>' +
      '<p class="ts-section-body">' + escapeHtml(issue.reason) + '</p></div>';

    var causesHTML = '';
    if (issue.commonCauses && issue.commonCauses.length) {
      var causesList = issue.commonCauses.map(function (c) {
        return '<li class="ts-list-item ts-list-item--cause"><i class="fas fa-circle"></i><span>' + escapeHtml(c) + '</span></li>';
      }).join('');
      causesHTML = '<div class="ts-section ts-section--causes">' +
        '<div class="ts-section-title"><i class="fas fa-magnifying-glass"></i> <span>أسباب شائعة</span></div>' +
        '<ul class="ts-list ts-list--causes">' + causesList + '</ul></div>';
    }

    var solutionHTML = '<div class="ts-section ts-section--solution">' +
      '<div class="ts-section-title"><i class="fas fa-lightbulb"></i> <span>كيف تحل المشكلة؟</span></div>' +
      '<p class="ts-section-body">' + escapeHtml(issue.solution) + '</p></div>';

    var quickFixesHTML = '';
    if (issue.quickFixes && issue.quickFixes.length) {
      var fixesHtml = issue.quickFixes.map(function (fix, i) {
        var actionAttr = fix.action ? 'data-ts-action="' + fix.action + '"' : '';
        var isPrimary = i === 0 && fix.action;
        return '<button type="button" ' + actionAttr + ' class="ts-quickfix ' +
          (isPrimary ? 'ts-quickfix--primary' : '') + '">' +
          '<span class="ts-quickfix-icon"><i class="fas ' + fix.icon + '"></i></span>' +
          '<span class="ts-quickfix-text">' + escapeHtml(fix.text) + '</span>' +
          (fix.action ? '<i class="fas fa-arrow-left ts-quickfix-arrow"></i>' : '') +
          '</button>';
      }).join('');
      quickFixesHTML = '<div class="ts-quickfixes">' +
        '<div class="ts-quickfixes-title"><i class="fas fa-bolt"></i> <span>حلول سريعة</span></div>' +
        '<div class="ts-quickfixes-grid">' + fixesHtml + '</div></div>';
    }

    var supportDetails = [
      { key: 'رقم المرجع', value: errorId, icon: 'fa-fingerprint' },
      { key: 'رقم الجلسة', value: SESSION_REF, icon: 'fa-hashtag' },
      { key: 'الأداة', value: toolName, icon: 'fa-toolbox' },
      { key: 'التوقيت', value: localTime, icon: 'fa-clock' },
      { key: 'حالة الإنترنت', value: isOnline ? 'متصل' : 'غير متصل', icon: isOnline ? 'fa-circle-check' : 'fa-circle-xmark' }
    ];

    var detailsRows = supportDetails.map(function (d) {
      return '<div class="ts-details-row">' +
        '<span class="ts-details-key"><i class="fas ' + d.icon + '"></i> ' + escapeHtml(d.key) + '</span>' +
        '<span class="ts-details-value">' + escapeHtml(d.value) + '</span></div>';
    }).join('');

    var detailsHTML = '<details class="ts-details">' +
      '<summary class="ts-details-summary">' +
      '<span><i class="fas fa-headset"></i> معلومات للدعم الفني</span>' +
      '<i class="fas fa-chevron-down ts-details-arrow"></i>' +
      '</summary>' +
      '<div class="ts-details-content">' + detailsRows +
      '<div class="ts-details-note"><i class="fas fa-info-circle"></i><span>أرسل رقم المرجع فقط عند التواصل مع الدعم</span></div>' +
      '</div></details>';

    var actionsHTML = '<div class="ts-actions">' +
      '<button type="button" class="ts-btn ts-btn--primary" data-ts-action="copy">' +
      '<i class="fas fa-copy"></i> <span>نسخ رقم المرجع</span>' +
      '</button>' +
      '<button type="button" class="ts-btn ts-btn--secondary" data-ts-action="close-modal">' +
      '<i class="fas fa-arrow-rotate-left"></i> <span>العودة</span>' +
      '</button></div>';

    var supportLinkHTML = '<button type="button" class="ts-support-link" data-ts-action="support">' +
      '<i class="fas fa-headset"></i><span>لم تحل المشكلة؟ تواصل مع الدعم</span></button>';

    return '<div class="ts-panel">' +
      headerHTML + countdownHTML + failedFieldsHTML +
      reasonHTML + causesHTML + solutionHTML + quickFixesHTML +
      '<div class="ts-connection-result hidden"></div>' +
      detailsHTML + actionsHTML + supportLinkHTML + '</div>';
  }

  function startCountdown(seconds) {
    if (countdownInterval) clearInterval(countdownInterval);
    var el = document.querySelector('[data-countdown]');
    if (!el) return;
    var remaining = seconds;
    var retryBtns = document.querySelectorAll('[data-ts-action="retry"]');
    retryBtns.forEach(function (b) { b.disabled = true; });
    countdownInterval = setInterval(function () {
      remaining--;
      el.textContent = formatTime(Math.max(0, remaining));
      if (remaining <= 0) {
        clearInterval(countdownInterval);
        countdownInterval = null;
        el.textContent = '✅ يمكنك المحاولة الآن';
        el.classList.add('is-ready');
        retryBtns.forEach(function (b) { b.disabled = false; });
      }
    }, 1000);
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-ts-action]');
    if (!btn) return;
    var action = btn.dataset.tsAction;

    if (action === 'open-help') { e.preventDefault(); openHelpCenter(); return; }
    if (action === 'open-tab') {
      e.preventDefault();
      var tab = btn.dataset.openTab;
      if (tab) openHelpCenter(tab);
      return;
    }
    if (action === 'switch-tab') {
      e.preventDefault();
      var tabName = btn.dataset.tab;
      if (tabName) switchHelpTab(tabName);
      return;
    }
    if (action === 'clear-search') { e.preventDefault(); clearHelpSearch(); return; }

    if (action === 'trigger-issue') {
      e.preventDefault();
      var tool = btn.getAttribute('data-tool') || 'غير محددة';
      var type = btn.getAttribute('data-type') || 'unknown';
      var detailsStr = btn.getAttribute('data-details');
      var details = {};
      if (detailsStr) { try { details = JSON.parse(detailsStr); } catch (err) {} }
      openTroubleshootModal(tool, type, details);
      return;
    }

    if (action === 'open-faq') {
      e.preventDefault();
      var faqId = btn.getAttribute('data-faq-id');
      if (faqId) openFaqSection(faqId);
      return;
    }

    if (action === 'toggle-faq') { e.preventDefault(); toggleFaqItem(btn); return; }
    if (action === 'close-modal') { e.preventDefault(); closeTroubleshootModal(); return; }
    if (action === 'close-center') { e.preventDefault(); closeHelpCenter(); return; }
    if (action === 'reload') { e.preventDefault(); closeTroubleshootModal(); setTimeout(function () { location.reload(); }, 200); return; }
    if (action === 'back') { e.preventDefault(); closeTroubleshootModal(); setTimeout(function () { history.back(); }, 200); return; }
    if (action === 'call-emergency') { e.preventDefault(); closeTroubleshootModal(); setTimeout(function () { window.location.href = 'tel:' + CONFIG.emergencyPhone; }, 200); return; }

    // ✅ تواصل مع الدعم → يفتح نافذة التواصل في موقعك
if (action === 'support') {
  e.preventDefault();
  closeTroubleshootModal();
  setTimeout(function () {
    window.open('https://lomedx.pages.dev/contact', '_blank', 'noopener');
  }, 300);
  return;
}



    if (action === 'copy-id') {
      e.preventDefault();
      copyToClipboard(btn.dataset.errorId).then(function (ok) {
        showToast(ok ? 'تم نسخ المعرّف' : 'تعذّر النسخ', ok ? 'success' : 'error');
      });
      return;
    }

    if (action === 'copy') {
      e.preventDefault();
      if (!currentTsErrorId) { showToast('لا يوجد معرّف', 'error'); return; }
      var id = currentTsErrorId;
      var originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>جارٍ النسخ...</span>';
      copyToClipboard(id).then(function (ok) {
        if (ok) {
          btn.innerHTML = '<i class="fas fa-check"></i><span>تم النسخ ✓</span>';
          showToast('تم نسخ: ' + id, 'success');
          setTimeout(function () { btn.disabled = false; btn.innerHTML = originalHTML; }, 2000);
        } else {
          btn.disabled = false;
          btn.innerHTML = originalHTML;
          showToast('انسخ يدوياً: ' + id, 'error');
        }
      });
      return;
    }

    if (action === 'test-connection') {
      e.preventDefault();
      var box = document.querySelector('.ts-connection-result');
      if (!box) return;
      box.classList.remove('hidden');
      box.innerHTML = '<div class="ts-connection-status ts-connection-status--loading">' +
        '<i class="fas fa-spinner fa-spin"></i><span>جارٍ اختبار الاتصال...</span></div>';
      testServerConnection().then(function (result) {
        var ok = result.ok;
        box.innerHTML = '<div class="ts-connection-status ' + (ok ? 'ts-connection-status--ok' : 'ts-connection-status--fail') + '">' +
          '<i class="fas ' + (ok ? 'fa-circle-check' : 'fa-circle-xmark') + '"></i>' +
          '<span>' + (ok ? 'الاتصال سليم' : 'تعذّر الاتصال') + '</span>' +
          '<span class="ts-connection-time">' + result.time + 'ms</span></div>';
        showToast(ok ? 'الاتصال سليم' : 'مشاكل في الاتصال', ok ? 'success' : 'error');
      });
      return;
    }

    

  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'helpSearchInput') {
      filterHelpCenter(e.target.value);
    }
  });

  function testServerConnection() {
    var url = location.pathname === '/' ? '/favicon.ico' : location.pathname.split('?')[0];
    var start = performance.now();
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, CONFIG.testTimeoutMs);
    return fetch(url, { method: 'HEAD', cache: 'no-store', signal: controller.signal })
      .then(function () { clearTimeout(timer); return { ok: true, time: Math.round(performance.now() - start) }; })
      .catch(function () { clearTimeout(timer); return { ok: false, time: Math.round(performance.now() - start) }; });
  }

  function registerRetry(fn) { retryFunction = fn; }

  function retryLastAction() {
    if (typeof retryFunction === 'function') {
      var fn = retryFunction;
      retryFunction = null;
      try { return Promise.resolve(fn()).catch(function () { showToast('فشلت المحاولة مرة أخرى', 'error'); }); }
      catch (e) { showToast('فشلت المحاولة مرة أخرى', 'error'); }
    } else {
      showToast('لا توجد عملية لإعادة المحاولة', 'info');
    }
    return Promise.resolve();
  }

  function injectFaqSchema() {
    var old = document.getElementById('helpCenterFaqSchema');
    if (old) old.remove();
    var mainEntity = [];
    FAQ_DATA.forEach(function (section) {
      section.faqs.slice(0, 3).forEach(function (faq) {
        mainEntity.push({
          '@type': 'Question',
          'name': faq.q,
          'acceptedAnswer': { '@type': 'Answer', 'text': faq.a.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() }
        });
      });
    });
    var schema = {
      '@context': 'https://schema.org',
      '@type': 'FAQPage',
      'name': 'مركز المساعدة وحل المشكلات - LomedX',
      'identifier': SESSION_REF,
      'mainEntity': mainEntity
    };
    var script = document.createElement('script');
    script.type = 'application/ld+json';
    script.id = 'helpCenterFaqSchema';
    script.textContent = JSON.stringify(schema);
    document.head.appendChild(script);
  }

  document.addEventListener('click', function (e) {
    var overlay = document.getElementById('helpCenterOverlay');
    if (overlay && e.target === overlay && overlay.classList.contains('active')) closeHelpCenter();
    var tsOverlay = document.getElementById('tsModalOverlay');
    if (tsOverlay && e.target === tsOverlay && tsOverlay.classList.contains('active')) closeTroubleshootModal();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      var tsOverlay = document.getElementById('tsModalOverlay');
      if (tsOverlay && tsOverlay.classList.contains('active')) { closeTroubleshootModal(); return; }
      var overlay = document.getElementById('helpCenterOverlay');
      if (overlay && overlay.classList.contains('active')) closeHelpCenter();
    }
  });

  window.openHelpCenter = openHelpCenter;
  window.closeHelpCenter = closeHelpCenter;
  window.switchHelpTab = switchHelpTab;
  window.filterHelpCenter = filterHelpCenter;
  window.clearHelpSearch = clearHelpSearch;
  window.openFaqSection = openFaqSection;
  window.toggleFaqItem = toggleFaqItem;
  window.openTroubleshootModal = openTroubleshootModal;
  window.closeTroubleshootModal = closeTroubleshootModal;
  window.registerRetry = registerRetry;
  window.retryLastAction = retryLastAction;
  window.showToast = showToast;
  window.getSessionReference = function () { return SESSION_REF; };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', updateCounts);
  } else {
    updateCounts();
  }

  if (window.console) {
    console.log('%c💎 LomedX Help Center v' + CONFIG.version + ' — Session: ' + SESSION_REF,
      'background:linear-gradient(135deg,#D4A040,#F0D77B);color:#1A1508;padding:6px 14px;border-radius:6px;font-weight:bold;font-size:12px;');
  }

})(window, document);
</script>
