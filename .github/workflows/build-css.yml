name: Compile Tailwind CSS

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Tailwind CLI
        run: npm install -g tailwindcss

      - name: Build CSS
        run: |
          mkdir -p css
          tailwindcss -i ./src/input.css -o ./css/style.css --config tailwind-config.js --minify

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add css/style.css
          git commit -m "Auto compile Tailwind CSS" || echo "No changes to commit"
          git push
